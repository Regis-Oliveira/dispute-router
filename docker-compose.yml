services:
  postgres:
    image: postgres:16-alpine
    container_name: dr-postgres
    environment:
      POSTGRES_USER: dispute
      POSTGRES_PASSWORD: dispute
      POSTGRES_DB: dispute_router
    ports:
      - "5433:5432"
    volumes:
      - dr-pgdata:/var/lib/postgresql/data
    command:
      # Tuned a little for bulk-loading half a million rows on a laptop.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - track_io_timing=on
      # Log anything slower than 200ms so index work has evidence behind it.
      - -c
      - log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute -d dispute_router"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dr-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dr-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dr-pgdata:
  dr-redisdata:
