services:
  postgres:
    # pgvector's own image rather than plain postgres, because the precedent
    # retrieval in internal/agent needs the vector type and CREATE EXTENSION
    # cannot conjure one that is not compiled in. Same PostgreSQL 16, so an
    # existing data volume mounts unchanged.
    image: pgvector/pgvector:pg16
    container_name: dr-postgres
    environment:
      POSTGRES_USER: dispute
      POSTGRES_PASSWORD: dispute
      POSTGRES_DB: dispute_router
    ports:
      - "5433:5432"
    volumes:
      - dr-pgdata:/var/lib/postgresql/data
    command:
      # Tuned a little for bulk-loading half a million rows on a laptop.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - track_io_timing=on
      # Log anything slower than 200ms so index work has evidence behind it.
      - -c
      - log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute -d dispute_router"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dr-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dr-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # LocalStack runs the real AWS APIs locally: same SDK, same calls, same error
  # types, no account and no spend. SQS, S3 and Secrets Manager are all in the
  # free Community edition. ECS is not - deploying the services is the one part
  # of Phase 4 that needs a real account.
  localstack:
    image: localstack/localstack:4
    container_name: dr-localstack
    environment:
      # ec2 is here only so `tofu plan` can resolve the VPC and subnet data
      # sources against something. Nothing in this project uses EC2 at runtime.
      SERVICES: sqs,s3,secretsmanager,ec2,sts
      DEBUG: "0"
      # Credentials are not checked by Community, but the SDK insists on
      # finding some, and naming them "test" makes it obvious in any log that
      # these are not real.
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - dr-localstack:/var/lib/localstack
      # LocalStack needs the host Docker socket for the services that spawn
      # containers; harmless for SQS and S3, required by others.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  dr-pgdata:
  dr-redisdata:
  dr-localstack:
